<!-- User registration form -->
<!DOCTYPE html>
    
    <head>
        <meta charset="UTF-8">

        <title>USER REGISTRATION</title>
           
    </head>
    <body>
        <div>
        <h1>Enter your details for job event registration</h1>    
        <form method="post" action="./Submit.html" onsubmit="return validateUserInput()">
        <label for="studentname">Student Name:</label>
        <input type="text" id="studentname" name="studentname" required><br><br>
        <label for="studentid">Student ID:</label>
        <input type="text" id="studentid" name="studentid" required><br><br>
        <label>Skills:</label><br>
        <input type="checkbox" name="skills" value="C"> C<br>
        <input type="checkbox" name="skills" value="C++"> C++<br>
        <input type="checkbox" name="skills" value="Java"> Java<br>
        <input type="checkbox" name="skills" value="Python"> Python<br>
        <input type="checkbox" name="skills" value="DevOps"> DevOps<br><br>
        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male<br>
        <input type="radio" name="gender" value="Female"> Female<br><br>
        <label for="location">Location:</label>
        <select id="location" name="location">
            <option value="Hyderabad">Hyderabad</option>
            <option value="Mumbai">Mumbai</option>
            <option value="Delhi">Delhi</option>
            <option value="Vishakapatnam">Vishakapatnam</option> <!-- Added during discussion with Harsha as a requirement fulfillment --> 
        </select><br><br>
        <input type="submit" value="Submit">
        </form>
        </div>
        <script src="tests.js"></script>
    </body>
</html>
